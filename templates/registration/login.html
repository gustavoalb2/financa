{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gestão Financeira Pessoal</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="auth-wrapper">

  <div class="auth-card">
    <div class="text-center mb-4">
      <h2 class="fw-bold h3 mb-1 text-light">Finança</h2>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger border-0 small py-2 px-3 mb-3 text-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuário ou senha incorretos.
      </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label fw-semibold text-secondary small">Usuário</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" id="id_username" placeholder="Digite seu usuário" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label for="id_password" class="form-label fw-semibold text-secondary small">Senha</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" id="id_password" placeholder="Digite sua senha" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold rounded-3 mb-3 d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-box-arrow-in-right fs-5"></i> Acessar Sistema
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
